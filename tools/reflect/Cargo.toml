[package]
name = "reflect"
version = "0.1.0"
edition = "2024"
description = "Reflexive analysis of exo-self session data: engagement correlations, preference inference with provenance tracking, cross-machine reporting via redb"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
redb = "2"
