[package]
name = "exo-self"
version = "1.6.0"
edition = "2024"
description = "Cognitive ecology hooks for Claude Code"

[[bin]]
name = "exo-self"
path = "src/main.rs"

[features]
default = ["reflect-db"]
reflect-db = ["dep:redb"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
redb = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
