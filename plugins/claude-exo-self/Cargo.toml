[package]
name = "exo-self"
version = "1.1.0"
edition = "2024"
description = "Persistent identity hooks for Claude Code"

[[bin]]
name = "exo-self"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
glob = "0.3"

