repos:
  - repo: local
    hooks:
      - id: preflight
        name: preflight (format + lint + auto-fix)
        language: system
        entry: /home/bryan/.claude/bin/preflight
        always_run: true
        pass_filenames: false
      - id: sync-version
        name: sync version to marketplace.json + plugin.json
        language: system
        entry: ./scripts/sync-version.sh
        always_run: true
        pass_filenames: false
