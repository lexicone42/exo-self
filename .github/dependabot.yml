# Dependency updates for exo-self.
#
# One grouped pull request a week per ecosystem, so updates arrive as a single
# change that CI checks, not a stream. A security update is not held for the
# weekly run: GitHub opens those on their own when an advisory lands.
#
# A Dependabot pull request is a prompt to look, not a verdict. CI passing
# means the suite still passes with the new versions. It does not mean the
# update was needed or that the changelog was read.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Minor and patch updates together, once a week. A major version arrives
      # as its own pull request so it is looked at on its own: the first grouped
      # update bundled six patch bumps with redb 2 -> 5 and failed to build.
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # redb is the store behind `exo-self reflect`. A major version changes its
      # API and may change the file format, so it is upgraded on purpose, with
      # the existing database in mind, not by a weekly bump.
      - dependency-name: "redb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
